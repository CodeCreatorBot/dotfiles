[providers]
default = [
  "desktopapplications",
  "websearch",
  "menus",
  "calc",
  "clipboard",
  "files",
]
empty = ["desktopapplications"]
max_results = 50

# ── Prefixes ──────────────────────────────────────────────
[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "^"
provider = "menus:powermenu"

# ── Keybindings ───────────────────────────────────────────
[keybinds]
close = ["Escape"]
next = ["Down"]
previous = ["Up"]
