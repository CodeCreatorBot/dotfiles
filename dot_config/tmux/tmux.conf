# tmux reads ~/.config/tmux/tmux.conf by default
# use C-Space as a Compose/Caps-friendly tmux prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# load marker + quick reload to confirm active config
set -gq @chezmoi_tmux_loaded 1
bind r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded ~/.config/tmux/tmux.conf"

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# open new windows in current pane path
bind c new-window -c "#{pane_current_path}"

# switch panes with Alt + hjkl
bind -nr M-h select-pane -L
bind -nr M-j select-pane -D
bind -nr M-k select-pane -U
bind -nr M-l select-pane -R

# switch windows with Alt + arrow keys
bind -nr M-Left previous-window
bind -nr M-Right next-window

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# indexing
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with window
setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed
