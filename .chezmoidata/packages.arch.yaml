# Arch Linux packages — consumed by run_once_before_10-arch.sh.tmpl
# (dev + toolchains) and run_once_after_20-arch-desktop.sh.tmpl (desktop).
#
# Shape — os.env.[flag].installer = [packages] (flag optional):
#   dev     → always-installed base, no flag: arch.dev.pacman
#   desktop → switch-gated: arch.desktop.<flag>.<installer>
# The flag VALUES live in chezmoi.toml [data] (single source of truth —
# they also gate file deployment in .chezmoiignore). This file only lists
# what each flag installs.
arch:
  dev:
    pacman:
      - neovim
      - eza
      - zoxide
      - fzf
      - starship
      - ripgrep
      - fd
      - bat
      - lazygit
      - ghostty
      - docker
      - docker-compose

  desktop:
    # Caelestia Shell (Quickshell-based desktop shell on top of Hyprland).
    # Replaces waybar, dunst, walker, matugen, satty, hyprlock/hypridle/
    # hyprpaper, elephant. Hyprland stays (the shell is NOT a compositor);
    # its visual config is owned by the caelestia dots, not chezmoi.
    # caelestia-cli/shell pull their transitive deps (quickshell-git, grim,
    # slurp, swappy, wl-clipboard, cliphist, fuzzel, …) via yay.
    caelestia:
      pacman:
        - hyprland
        - xdg-desktop-portal-hyprland
        - hyprpolkitagent
        - qt5-wayland
        - qt6-wayland
        - sddm
        - plymouth
      aur:
        - caelestia-cli
        - caelestia-shell
    obsidian:
      pacman:
        - obsidian
    docker:
      pacman:
        - docker
        - docker-compose
      services:
        - docker.service
      groups:
        - docker
    onedrive:
      aur:
        - onedrive-abraunegg
    # Fingerprint login (FW13 AMD Goodix 27c6:609c — native libfprint
    # goodixmoc driver). PAM + wake workaround: run_once_after_40-fprintd.
    fprint:
      pacman:
        - fprintd
    # Local AI stack (NPU-only) — inference stays on the XDNA2 NPU via
    # lemonade-server + FastFlowLM; no ollama/GPU inference by design.
    # (screenpipe recording is a volta tool: toolchains.desktop.voltaTools
    # in packages.toolchains.yaml, installed by run_once_after_20-arch.)
    ai:
      pacman:
        - xrt
        - xrt-plugin-amdxdna
        - fastflowlm
        - lemonade-server
    stremio:
      aur:
        - com.stremio.Stremio
    audiobooks:
      aur:
        - com.github.geigi.cozy
    bitwarden:
      aur:
        - bitwarden-bin
    grayjay:
      aur:
        - grayjay-bin
    nordvpn:
      aur:
        - nordvpn-bin
