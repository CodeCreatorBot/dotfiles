# Arch Linux packages — consumed by run_once_before_10-arch.sh.tmpl
# (dev + toolchains) and run_once_after_20-arch-desktop.sh.tmpl (desktop).
#
# Desktop packages are grouped BY SWITCH NAME. The switch VALUES live in
# chezmoi.toml [data] (single source of truth — they also gate file
# deployment in .chezmoiignore). This file only lists what each switch
# installs.
arch:
  dev:
    - neovim
    - eza
    - zoxide
    - fzf
    - starship
    - ripgrep
    - fd
    - bat
    - lazygit
    - ghostty
    - docker
    - docker-compose

  desktop:
    # Caelestia Shell (Quickshell-based desktop shell on top of Hyprland).
    # Replaces waybar, dunst, walker, matugen, satty, hyprlock/hypridle/
    # hyprpaper, elephant. Hyprland stays (the shell is NOT a compositor);
    # its visual config is owned by the caelestia dots, not chezmoi.
    # caelestia-cli/shell pull their transitive deps (quickshell-git, grim,
    # slurp, swappy, wl-clipboard, cliphist, fuzzel, …) via yay.
    caelestia:
      pacman:
        - hyprland
        - xdg-desktop-portal-hyprland
        - hyprpolkitagent
        - qt5-wayland
        - qt6-wayland
        - sddm
        - plymouth
      aur:
        - caelestia-cli
        - caelestia-shell
    obsidian:
      pacman:
        - obsidian
    docker:
      pacman:
        - docker
        - docker-compose
      services:
        - docker.service
      groups:
        - docker
    onedrive:
      aur:
        - onedrive-abraunegg
    flatpak:
      - com.stremio.Stremio
      - com.github.geigi.cozy
    aurExtras:
      - bitwarden-bin
      - grayjay-bin
      - nordvpn-bin
